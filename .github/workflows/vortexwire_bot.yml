name: VortexWire Auto Publisher

on:
  schedule:
    # Runs twice a day: 13:00 UTC (US Morning) and 19:00 UTC (US Afternoon)
    - cron: '0 13,19 * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 google-genai pyyaml

      - name: Run VortexWire Publisher
        run: python generate_articles.py
        env:
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}

      - name: Save and Push Articles
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Pull latest changes to avoid merge conflicts
          git pull origin main
          
          # Add all new or modified files (including the new .mdx files in content/)
          git add .
          
          # Commit and push only if there are changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "No new articles to publish."
          else
            git commit -m "Auto-publish new VortexWire brief: $(date)"
            git push origin main
          fi
